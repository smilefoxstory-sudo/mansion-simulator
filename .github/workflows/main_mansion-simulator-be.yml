name: Deploy Backend

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: mansion-simulator-be-hhhuabaudzd3gydj
          publish-profile: ${{ secrets.AZURE_BE_PUBLISH_PROFILE }}
          package: backend
