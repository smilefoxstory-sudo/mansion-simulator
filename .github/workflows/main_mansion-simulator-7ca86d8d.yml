name: Deploy Frontend (New)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
        run: |
          npm ci
          npm run build

      - name: Create package
        working-directory: frontend
        run: zip -r ../release.zip . -x ".git/*" ".github/*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: mansion-simulator-7ca86d8d
          publish-profile: ${{ secrets.AZURE_FE_NEW_PUBLISH_PROFILE }}
          package: release.zip
